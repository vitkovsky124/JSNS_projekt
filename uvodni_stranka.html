<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5ef">
  <meta name="description" content="Vyber počet hráčů a zahraj si obrázkové pexeso.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="uvodni_stranka.css">
</head>
<body>
  <button class="theme-toggle" type="button" aria-pressed="false">Tmavý režim</button>
  <main class="page">
    <section class="start-panel" aria-labelledby="title">
      <h1 id="title">Pexeso</h1>
      <br>
      <fieldset class="player-picker">
        <legend>Kolik vás bude hrát?</legend>
        <div class="player-options">
          <label class="player-option">
            <input type="radio" name="players" value="1" checked>
            <span class="option-card"><span class="player-number">1</span><span class="player-label">hráč</span></span>
          </label>
          <label class="player-option">
            <input type="radio" name="players" value="2">
            <span class="option-card"><span class="player-number">2</span><span class="player-label">hráči</span></span>
          </label>
          <label class="player-option">
            <input type="radio" name="players" value="3">
            <span class="option-card"><span class="player-number">3</span><span class="player-label">hráči</span></span>
          </label>
          <label class="player-option">
            <input type="radio" name="players" value="4">
            <span class="option-card"><span class="player-number">4</span><span class="player-label">hráči</span></span>
          </label>
        </div>
      </fieldset>

      <div class="player-names" id="playerNames" aria-live="polite"></div>

      <label class="difficulty-picker" id="difficultyPicker" for="botDifficulty">
        <span>Obtížnost bota</span>
        <select id="botDifficulty" name="difficulty">
          <option value="easy">Lehká</option>
          <option value="medium" selected>Střední</option>
          <option value="hard">Těžká</option>
        </select>
      </label>

      <a class="start-button" id="startGame" href="pexeso.html?players=1&amp;difficulty=medium">Začít hrát <span class="fa-icon" aria-hidden="true">&#xf061;</span></a>
    </section>
  </main>
  <script src="theme.js"></script>
  <script src="uvodni_stranka.js"></script>
</body>
</html>
