<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5ef">
  <title>Picture Pexeso</title>
  <link rel="stylesheet" href="pexeso.css">
</head>
<body>
  <main class="game">

    <section class="intro" aria-labelledby="title">
      <h1 id="title">Nadpis placeholder</h1>
    </section>

    <section class="game-panel" aria-label="Memory card game">
      <div class="toolbar">
        <div class="stats" aria-live="polite">
          <div class="stat"><span class="stat-label">TAHY</span><strong id="moves">0</strong></div>
          <span class="stat-divider" aria-hidden="true"></span>
          <div class="stat"><span class="stat-label">BODY</span><strong><span id="pairs">0</span><span class="stat-total"></span></strong></div>
        </div>
        <button class="restart" id="restart" type="button"><span aria-hidden="true">↻</span> Nová hra</button>
      </div>

      <div class="board-wrap">
        <div class="board" id="board" aria-label="31 pairs of face-down picture cards"></div>
      </div>
      <div class="win-message" id="winMessage" role="status" hidden>
        <span class="win-sparkle" aria-hidden="true">✦</span>
        <button id="playAgain" type="button">Play again</button>
      </div>
    </section>
  </main>
  <script src="pexeso.js"></script>
</body>
</html>
